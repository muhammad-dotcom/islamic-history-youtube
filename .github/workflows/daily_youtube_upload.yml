name: Daily YouTube Upload

# Runs every day at 9:00 AM UTC (adjust the cron to your preferred time zone)
# UTC 9 AM = EST 4 AM / CST 3 AM / PST 1 AM
# Change to '0 14 * * *' for 2 PM UTC = 9 AM EST / 10 AM CST / 7 AM PST

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:  # also allows manual "Run workflow" button in GitHub UI

permissions:
  contents: write   # needed to commit schedule state back to the repo

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6-hour safety cap (8h audio gen + render + upload < 3h total)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        working-directory: personal/youtube-ambient
        run: pip install -e . --quiet

      - name: Generate nature backgrounds (~4 min, no external assets needed)
        working-directory: personal/youtube-ambient
        run: python scripts/generate_bg_videos.py
        # data/visuals/nature/ isn't committed to git (large binaries) — CI
        # starts from a fresh checkout each run, so this regenerates them
        # every time. Used by both long-form nature videos and Shorts footage.

      - name: Write secrets to files
        working-directory: personal/youtube-ambient
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "$YOUTUBE_TOKEN_JSON" > youtube_token.json
          echo "$YOUTUBE_CLIENT_SECRETS_JSON" > client_secrets.json
          printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" > .env

      - name: Run pipeline (auto — planner picks next sound)
        working-directory: personal/youtube-ambient
        run: python scripts/run_pipeline.py --auto

      - name: Run Shorts pipeline (auto — independent rotation)
        if: always()
        working-directory: personal/youtube-ambient
        run: python scripts/run_shorts.py --auto

      - name: Commit updated schedule state
        if: always()
        working-directory: personal/youtube-ambient
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/schedule_state.json data/shorts_schedule_state.json data/analytics.db data/playlist_ids.json 2>/dev/null || true
          git diff --cached --quiet && echo "Nothing to commit" || \
            git commit -m "chore: advance upload schedule [skip ci]" && git push
