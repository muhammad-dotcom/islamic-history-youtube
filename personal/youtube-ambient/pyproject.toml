[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-ambient"
version = "0.1.0"
description = "Automated ambient/sleep sound YouTube channel pipeline"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "soundfile>=0.12",
    "pillow>=10.0",
    "anthropic>=0.28",
    "google-api-python-client>=2.120",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "python-dotenv>=1.0",
    "click>=8.1",
    "tqdm>=4.66",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yt_ambient"]

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"
