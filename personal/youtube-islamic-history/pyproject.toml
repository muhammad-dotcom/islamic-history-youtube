[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-history"
version = "0.1.0"
description = "Fully automated Islamic history YouTube channel pipeline"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.28",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "google-api-python-client>=2.120",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "pillow>=10.0",
    "click>=8.1",
    "tqdm>=4.66",
    "openai>=1.30",    # optional: DALL-E 3 fallback
    "kokoro-onnx>=0.4",  # free offline neural TTS
]

[tool.hatch.build.targets.wheel]
packages = ["src/yt_history"]

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"
